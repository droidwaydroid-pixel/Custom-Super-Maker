name: Android Super Repack (Universal FS)

on:
  workflow_dispatch:
    inputs:
      device_preset:
        description: 'Select Stock Firmware Source'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none (Use Custom URL below)'
          - 'Samsung A04s (64GB)'
          - 'Samsung A12s A127F'
          - 'Samsung A15 (128/256GB)'
      stock_firmware_url:
        description: 'Custom Stock Firmware URL (Required if preset is none)'
        required: false
        type: string
      custom_system_url:
        description: 'Custom ROM URL (LineageOS, etc.)'
        required: true
        type: string
      upload_to_release:
        description: 'Upload to Release?'
        required: true
        type: boolean
        default: false
      silent_mode:
        description: 'Silent mode'
        required: false
        type: boolean
        default: true

jobs:
  repack-super:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # Устанавливаем официальные пакеты Android-инструментов Ubuntu, куда уже входят lpunpack и lpmake
          sudo apt-get install -y android-sdk-libsparse-utils android-sdk-ext4-utils tar xz-utils liblz4-tool unzip p7zip-full file wget curl megatools f2fs-tools erofs-utils python3-pip
          pip install --break-system-packages gdown || pip install gdown

      - name: Verify and Prepare Script
        run: |
          if [ ! -f "./scripts/repacksuper.sh" ]; then echo "✗ Error: repacksuper.sh not found" && exit 1; fi
          chmod +x ./scripts/repacksuper.sh
          mkdir -p work

      - name: Download Base Firmware
        run: |
          mkdir -p work
          cd work
          PRESET="${{ github.event.inputs.device_preset }}"
          URL=$(echo "${{ github.event.inputs.stock_firmware_url }}" | tr -d '[:space:]"')

          echo "==> Downloading Base Firmware..."
          if [[ "$PRESET" == "Samsung A04s (64GB)" ]]; then
            gdown --quiet --output stock_firmware.tar '1C9GtYTn1EZ4sQN7qfJeWN6gxDj_WbgY-'
          elif [[ "$PRESET" == "Samsung A12s A127F" ]]; then
            gdown --quiet --output stock_firmware.tar '1J38ATKSjoVN2yqVc_GF6JD9GKaPuhK2g'
          elif [[ "$PRESET" == "Samsung A15 (128/256GB)" ]]; then
            gdown --quiet --output stock_firmware.tar '12FoeBkPDHddj4lzd-T6pjHRQ8Ey3c2U8'
          elif [ -n "$URL" ]; then
            FILE_ID=$(echo "$URL" | grep -oP '(?<=/d/)[^/]+|(?<=id=)[^&]+' | head -n 1)
            
            if [ -n "$FILE_ID" ]; then
              echo "Detected Google Drive ID: $FILE_ID"
              gdown --quiet --output stock_firmware.tar "$FILE_ID"
            elif [[ $URL == *"mega.nz"* ]]; then 
              megadl -o stock_firmware.tar "$URL"
            else 
              curl -L -A "Mozilla/5.0" -o stock_firmware.tar "$URL"
            fi
          else
            echo "::error::No device preset or URL selected." && exit 1
          fi

          if [ ! -s "stock_firmware.tar" ] || [ $(stat -c%s "stock_firmware.tar") -lt 1000000 ]; then 
            echo "✗ Error: Firmware download failed or file is too small."
            exit 1
          fi

          echo "==> Extracting super.img.lz4..."
          tar -xvf "stock_firmware.tar" --wildcards '*super.img*.lz4' || tar -xvf "stock_firmware.tar" '*super.img*.lz4'
          rm "stock_firmware.tar"

          echo "==> Decompressing LZ4..."
          SUPER_LZ4=$(ls *super.img*.lz4 | head -n 1)
          lz4 -d "$SUPER_LZ4" stock_super.img
          rm "$SUPER_LZ4"

          if simg2img stock_super.img stock_super.raw 2>/dev/null; then
            mv stock_super.raw stock_super.img
          fi

      - name: Download and Extract Custom System
        run: |
          cd work
          echo "==> Downloading Custom ROM..."
          ROM_URL=$(echo "${{ github.event.inputs.custom_system_url }}" | tr -d '[:space:]"')
          
          ROM_ID=$(echo "$ROM_URL" | grep -oP '(?<=/d/)[^/]+|(?<=id=)[^&]+' | head -n 1)
          if [ -n "$ROM_ID" ]; then
              gdown --quiet --output custom_rom_package "$ROM_ID"
          elif [[ $ROM_URL == *"pixeldrain.com"* ]]; then
              curl -L -A "Mozilla/5.0" -o custom_rom_package "$ROM_URL"
          else
              wget -O custom_rom_package "$ROM_URL"
          fi

          CLEAN_URL="${ROM_URL%%\?*}"
          ROM_NAME=$(basename "$CLEAN_URL")
          echo "ROM_NAME=$ROM_NAME" >> $GITHUB_ENV

          FILE_DESC=$(file -b custom_rom_package)
          if [[ "$FILE_DESC" == *"XZ compressed"* ]]; then
              mv custom_rom_package c.img.xz && unxz c.img.xz && mv c.img custom_system.img
          elif [[ "$FILE_DESC" == *"Zip archive"* ]]; then
              unzip -o custom_rom_package
          elif [[ "$FILE_DESC" == *"7-zip archive"* ]]; then
              7z x custom_rom_package
          elif [[ "$FILE_DESC" == *"gzip compressed"* ]]; then
              mv custom_rom_package c.img.gz && gzip -d c.img.gz && mv c.img custom_system.img
          else
              mv custom_rom_package custom_system.img
          fi

          if [ ! -f "custom_system.img" ]; then
              IMG_FILE=$(find . -type f -name "*.img" ! -name "stock_super.img" -printf "%s\t%p\n" | sort -n | tail -1 | cut -f2-)
              mv "$IMG_FILE" custom_system.img
          fi
          
          if simg2img custom_system.img custom_system.raw 2>/dev/null; then
            mv custom_system.raw custom_system.img
          fi

      - name: Modern Native Repack
        run: |
          cd work
          mkdir -p extracted
          
          echo "==> Unpacking original Samsung super.img..."
          lpunpack stock_super.img extracted/
          
          echo "==> Replacing system partition with custom ROM..."
          cp -f custom_system.img extracted/system.img
          
          echo "==> Calculating partition sizes..."
          SUPER_SIZE=$(stat -c%s stock_super.img)
          
          OPTIONS="--metadata-size 65536 --super-name super --output repacked_super.img"
          OPTIONS="$OPTIONS --device super:$SUPER_SIZE"
          
          PART_ARGS=""
          IMAGE_ARGS=""
          
          for file in extracted/*.img; do
            part_name=$(basename "$file" .img)
            part_size=$(stat -c%s "$file")
            
            part_size=$(( (part_size + 4095) / 4096 * 4096 ))
            truncate -s $part_size "$file"
            
            PART_ARGS="$PART_ARGS --partition ${part_name}:readonly:${part_size}:main"
            IMAGE_ARGS="$IMAGE_ARGS --image ${part_name}=$file"
          done
          
          OPTIONS="$OPTIONS --metadata-slots 2 --group main:$SUPER_SIZE"
          
          echo "==> Building new super.img via lpmake..."
          lpmake $OPTIONS $PART_ARGS $IMAGE_ARGS
          
          echo "==> Converting final image back to compressed Sparse format..."
          img2simg repacked_super.img repacked_super_sparse.img
          mv repacked_super_sparse.img repacked_super.img

      - name: Create Tarball
        run: |
          cd work
          if [ ! -f "repacked_super.img" ]; then 
            echo "✗ Error: Repack failed, output image not found." && exit 1
          fi
          echo "==> Compressing repacked_super.img to tar for Odin..."
          tar -cvf repacked_super.tar repacked_super.img

      - name: Upload to Release
        if: ${{ github.event.inputs.upload_to_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "repack-${{ github.run_id }}"
          name: "Super Repack Build #${{ github.run_number }}"
          files: work/repacked_super.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
