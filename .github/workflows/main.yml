name: Android Super Repack (Universal FS)

on:
  workflow_dispatch:
    inputs:
      device_preset:
        description: 'Select Stock Firmware Source'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none (Use Custom URL below)'
          - 'Samsung A04s (64GB)'
          - 'Samsung A12s A127F'
          - 'Samsung A15 (128/256GB)'
      stock_firmware_url:
        description: 'Custom Stock Firmware URL (Required if preset is none)'
        required: false
        type: string
      custom_system_url:
        description: 'Custom ROM URL (LineageOS, etc.)'
        required: true
        type: string
      upload_to_release:
        description: 'Upload to Release?'
        required: true
        type: boolean
        default: false
      empty_product:
        description: 'Use empty product.img (-e)'
        required: false
        type: boolean
        default: false
      empty_system_ext:
        description: 'Use empty system_ext.img (-x)'
        required: false
        type: boolean
        default: false
      silent_mode:
        description: 'Silent mode (-s)'
        required: false
        type: boolean
        default: true
      writable:
        description: 'Make partitions writable (-w)'
        required: false
        type: boolean
        default: false

jobs:
  repack-super:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils tar xz-utils liblz4-tool unzip p7zip-full file wget curl megatools f2fs-tools erofs-utils python3-pip
          pip install --break-system-packages gdown || pip install gdown

      - name: Verify and Prepare Script
        run: |
          if [ ! -f "./scripts/repacksuper.sh" ]; then echo "✗ Error: repacksuper.sh not found" && exit 1; fi
          chmod +x ./scripts/repacksuper.sh
          mkdir -p work

      - name: Download Base Firmware
        run: |
          cd work
          PRESET="${{ github.event.inputs.device_preset }}"
          URL=$(echo "${{ github.event.inputs.stock_firmware_url }}" | tr -d '[:space:]"')

          echo "==> Downloading Base Firmware..."
          if [[ "$PRESET" == "Samsung A04s (64GB)" ]]; then
            gdown --quiet --output stock_firmware.tar '1C9GtYTn1EZ4sQN7qfJeWN6gxDj_WbgY-'
          elif [[ "$PRESET" == "Samsung A12s A127F" ]]; then
            gdown --quiet --output stock_firmware.tar '1J38ATKSjoVN2yqVc_GF6JD9GKaPuhK2g'
          elif [[ "$PRESET" == "Samsung A15 (128/256GB)" ]]; then
            gdown --quiet --output stock_firmware.tar '12FoeBkPDHddj4lzd-T6pjHRQ8Ey3c2U8'
          elif [ -n "$URL" ]; then
            if [[ $URL == *"mega.nz"* ]]; then 
              megadl -o stock_firmware.tar "$URL"
            elif [[ $URL == *"://google.com"* || $URL == *"://google.com"* || $URL == *"google.com"* ]]; then
              FILE_ID=$(echo "$URL" | grep -oP '(?<=/d/)[^/]+|(?<=id=)[^&]+' | head -n 1)
              echo "Detected Google Drive ID: $FILE_ID"
              gdown --quiet --output stock_firmware.tar "$FILE_ID"
            else 
              curl -L -A "Mozilla/5.0" -o stock_firmware.tar "$URL"
            fi
          else
            echo "::error::No device preset or URL selected." && exit 1
          fi

          if [ ! -s "stock_firmware.tar" ] || [ $(stat -c%s "stock_firmware.tar") -lt 1000000 ]; then 
            echo "✗ Error: Firmware download failed or file is too small."
            exit 1
          fi

          echo "==> Extracting super.img.lz4 directly from AP tar archive..."
          tar -xvf "stock_firmware.tar" --wildcards '*super.img*.lz4' || tar -xvf "stock_firmware.tar" '*super.img*.lz4'
          rm "stock_firmware.tar"

          echo "==> Decompressing LZ4..."
          SUPER_LZ4=$(ls *super.img*.lz4 | head -n 1)
          if [ -z "$SUPER_LZ4" ]; then echo "✗ Error: super.img.lz4 not found!" && exit 1; fi
          lz4 -d "$SUPER_LZ4" stock_super_sparse.img
          rm "$SUPER_LZ4"

          echo "==> Ensuring valid Android Sparse format..."
          # Если файл уже в raw, преобразуем его в правильный sparse формат, который ждет скрипт
          if ! simg2img stock_super_sparse.img stock_super_raw.img 2>/dev/null; then
            echo "Image is raw, converting to official sparse format..."
            img2simg stock_super_sparse.img stock_super_sparse.img.sparse
            mv stock_super_sparse.img.sparse stock_super_sparse.img
          else
            echo "Image was compressed sparse, restored to flat raw format."
            mv stock_super_raw.img stock_super_sparse.img
          fi

      - name: Download and Extract Custom System
        run: |
          cd work
          echo "==> Downloading Custom ROM..."
          ROM_URL=$(echo "${{ github.event.inputs.custom_system_url }}" | tr -d '[:space:]"')
          
          if [[ $ROM_URL == *"://google.com"* || $ROM_URL == *"://google.com"* || $ROM_URL == *"google.com"* ]]; then
              ROM_ID=$(echo "$ROM_URL" | grep -oP '(?<=/d/)[^/]+|(?<=id=)[^&]+' | head -n 1)
              gdown --quiet --output custom_rom_package "$ROM_ID"
          elif [[ $ROM_URL == *"pixeldrain.com"* ]]; then
              curl -L -A "Mozilla/5.0" -o custom_rom_package "$ROM_URL"
          else
              wget -O custom_rom_package "$ROM_URL"
          fi

          CLEAN_URL="${ROM_URL%%\?*}"
          ROM_NAME=$(basename "$CLEAN_URL")
          echo "Detected ROM Name: $ROM_NAME"
          echo "ROM_NAME=$ROM_NAME" >> $GITHUB_ENV

          FILE_DESC=$(file -b custom_rom_package)
          echo "Detected File Type: $FILE_DESC"

          if [[ "$FILE_DESC" == *"XZ compressed"* ]]; then
              mv custom_rom_package c.img.xz
              unxz c.img.xz
              mv c.img custom_system.img

          elif [[ "$FILE_DESC" == *"Zip archive"* ]]; then
              unzip -o custom_rom_package

          elif [[ "$FILE_DESC" == *"7-zip archive"* ]]; then
              7z x custom_rom_package

          elif [[ "$FILE_DESC" == *"gzip compressed"* ]]; then
              mv custom_rom_package c.img.gz
              gzip -d c.img.gz
              mv c.img custom_system.img

          else
              echo "Assuming raw image..."
              mv custom_rom_package custom_system.img
          fi

          if [ ! -f "custom_system.img" ]; then
              echo "==> Searching for extracted .img file..."
              IMG_FILE=$(find . -type f -name "*.img" ! -name "stock_super_sparse.img" -printf "%s\t%p\n" | sort -n | tail -1 | cut -f2-)

              if [ -z "$IMG_FILE" ]; then
                  echo "✗ Error: No .img file found after extraction!"
                  ls -R
                  exit 1
              fi

              echo "==> Found image: $IMG_FILE"
              mv "$IMG_FILE" custom_system.img
          fi

          echo "==> Custom system image prepared: custom_system.img"

      - name: Download ASRControl APK
        run: |
          cd work
          echo "==> Downloading ASRControl APK..."
          wget -q -O ASRControl.apk "https://github.com" || echo "Warning: APK download failed."

      - name: Run Repack
        run: |
          FLAGS="-r $(pwd)/work"
          if [ "${{ github.event.inputs.silent_mode }}" == "true" ]; then FLAGS="$FLAGS -s"; fi
          if [ "${{ github.event.inputs.empty_product }}" == "true" ]; then FLAGS="$FLAGS -e"; fi
          if [ "${{ github.event.inputs.empty_system_ext }}" == "true" ]; then FLAGS="$FLAGS -x"; fi
          if [ "${{ github.event.inputs.writable }}" == "true" ]; then FLAGS="$FLAGS -w"; fi

          echo "Running with flags: $FLAGS"
          # Добавлен вызов через bash для фикса синтаксической ошибки скрипта
          bash ./scripts/repacksuper.sh $FLAGS work/stock_super_sparse.img work/custom_system.img work/repacked_super.img

      - name: Create Tarball
        id: package
        run: |
          cd work
          if [ ! -f "repacked_super.img" ]; then 
            echo "✗ Error: Repack failed, output image not found." && exit 1
          fi
          echo "==> Compressing repacked_super.img to tar..."
          tar -cvf repacked_super.tar repacked_super.img
          echo "==> Compression finished successfully."

      - name: Upload to Release
        if: ${{ github.event.inputs.upload_to_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "repack-${{ github.run_id }}"
          name: "Super Repack Build #${{ github.run_number }}"
          files: work/repacked_super.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
